body:
  text: 唐一行禪師云但凡投師出家皆依此選僧圖取用若得一二識者方許出家全無識者反謗此教將佛聖言謬說只會目前之事未知末後一著所有十識皆是前生定也如無一二識者罪根深重不可得度除品格不凡於衆殊絶者弗在論也看十識之法年下取月掌圖之法年上起月月上起日日上起時二推年上起月月上起日日上起時三推如前至每推時行運或一歲運時前一位天星是次第倣此每運七年流年從運位起星推去月建從流年起星推去男順行女逆行吉凶可驗矣通天識子三六十月丑正七十月寅六十十一月卯三九十二月辰正七十月巳三月十月午正七十月未正四六月申正七十月酉三六十二月戌二七十月亥正八十月三合識子二五八月丑二四五月寅五八十月卯六八十月辰正七十月巳二八十一月午正四七月未正七十月申二七十一月酉二六十二月戌正七十月亥二五八月善知識子二八十二月丑六九十一月寅正七十月卯六八十月辰二七十月巳二六十月午正四十月未二五八月申正四十月酉七十十一月戌二七九月亥三六十月方丈識子二七十二月丑二八十月寅二九十月卯六八十月辰二三十一月巳二六十月午正四十月未二五八月申二四十月酉五七十一月戌二五九月亥二六七十菩提識子二五十二月丑二六十月寅正七十月卯三七九月辰二六九月巳四七十月午二六七月未六九十二月申正七十月酉正八十二月戌二九十二月亥二九十二月福祿識子二八十一月丑二九十二月寅四七十二月卯二五十一辰二七十二巳二七十月午二五八月未三五十一申四七十月酉二五十二戌二六十一亥四七十月起家識子正七十一丑二五十一寅二六十月卯正四七月辰二五八月巳二六九月午二六九月未四七十月申五八十一酉二九十二戌五七十月亥二九十二消災識子二六十月丑正月十月寅六八十一卯正四七月辰正四七月巳三四十一午九十十一未六八十一申正四七月酉二五八月戌三六九月亥九十十二成就識子二五九月丑五六九月寅四七十月卯五月十月辰三九十月巳三七九月午九十十一未六八十一申正四七月酉二五八月戌三六九月亥九十十二佛法識子五八十月丑六九十二寅五七十月卯三五八月辰三九十一巳三七九月午九十十一未六八十一申正四七月酉二五八月戌二六九月亥九十十二經云十二宮中去復還惟有重疊走江山世間多少榮枯者盡在山僧一掌看新刻看命一掌金唐釋氏一行著明胡氏文會堂校佛道天貴星時辰落在天貴宮一生清貴事和同志氣不凡人出類安然自在性明通此星主人清高有德有行大事成小災禍無侵若更得天權祿驛星助者榮昌富貴若犯重者主悲泣翻悔中下小人半吉之命若逢孤厄破刃照命者必為朝堂折挫之人見貴而未為全吉也鬼道天厄星時在厄中人混沌惺惺作事又癡呆此人帶疾方延壽還須勞碌作生涯此星在命主人帶疾若逢破刃相冲災疾必重若逢權貴星主人輕疾乃中上命也若逢孤驛奸星主作事遲疑一生啾唧定主蹭蹬離祖乃中下命也人道天權星時辰落在天權宮性格操持志氣雄作事差遲人也喜一呼百喏有威風此星在命主人聰明俊秀灑落襟懷有權有勢多智多能若逢貴福文壽星相助者人人拱聽重犯者權而無權乃中命也若逢厄破孤驛在命者作事勞力財帛不聚未能先能未會先會浮浪中命也畜道天破星時辰落在天破宮推金積玉也成空夜眠算計圖家富鈔袋誰知有蛀蟲此星主財帛空虗祖業耗散若得權貴福星相助亦為中命如遇驛刃孤厄犯重者作事艱難重重破敗浮浪東西之下命也修羅道天奸星大如滄海細如毛佛口蟠心兩面刀奸狡機謀藏毒性意多翻覆最難調此星照命主人一生勞碌啾唧奔波指東說西機變難測若得天貴福星相助財帛豐盈亦為上命若逢權刃星者必為奸權殘忍之小人言清行濁執性凶謀有害人之心無容人之量貪瞋太重非善人也若逢孤厄破驛定為慳貪嫉妒之小人乃下命也仙道天文星命遇天文秀氣清聰明智慧意惺惺男才女秀身清吉滿腹文章錦繡成此星照命主人聰明憐俐學識過人作事和美若逢天貴天福天藝星相助定為鰲頭獨占虎榜登名金階玉階之人也若遇天權天刃星者文武多才乃為上命如遇破厄孤驛及犯重者乃多學少成不為書算文墨之輩必為雲遊湖海之人乃手藝術士之下命也佛道天福星命逢天福是生時定然倉庫有餘盈寬洪大量根基穩財帛光華有福齊此星坐命主人受福清間性情自在度量寬洪根基穩實又得權刃相扶衣帛充足倉庫盈餘堆金積玉之命若犯重者衣祿不多若逢驛孤奸破星者必主慳貪嫉妒衣祿艱難之命也鬼道天驛星人道若逢天驛星搬移離祖不曾停身心不得片時靜走遍天涯足未寧此星照命主人離鄉別井骨肉情疏勞碌身心自成自立之命若逢福權貴刃壽文星者必主官祿供給車馬相隨乃榮顯之命若逢孤破厄星猶如風吹樹葉水上浮萍心猿意馬奔馳不定方外雲遊江湖跋涉之下命也若犯重而刃厄相刑者必為徒流之類人道天孤星時辰若逢此天孤六親兄弟有如無定作空門清淨客總有妻兒情分疏此星照命主一生孤獨男人得之六親無分女人得之尅子妨夫孤星犯重者反不為孤必為半僧半俗身在俗門心在空門之人若得權福貴壽星助乃上命也亦不免少年刑尅若逢破驛奸厄刃星必為雲水漂流下命也凡選故家之命要看孤星為主畜道天刃星天刃為人性太剛是非終日要爭強持刀弄斧刑心重好似將軍入戰場此星照命主一生剛狠性格躁具自做自是不受人觸受不得間氣風火性過端然無事若得權貴福星為人不俗禮義足以化強暴乃上命也若逢孤破奸厄膽大心粗形體殘疾不免斷髮身死乃下命也惡星少而吉星多者亦為中命犯重者必主殘疾修羅道天藝星天藝生人性最靈將南作北逞多能所為方便機關巧到處和同作事勤此星照命主人多智多能機巧近貴若犯重者主資質昏鈍懶惰愚頑多學少成匠作用力之輩若得天權貴福文壽俱全剛柔相濟雖為藝術亦可成立若逢天孤可為僧道之出類者乃中命也若逢破厄則藝業無成終為下命仙道天壽星天壽生人命最長上恭下敬性溫良一聞千悟心慈善喜怒中間有主張此星照命主人長壽康健智慧聰明作事溫良有救人之心無傷人之意恩中招怨作事朴實衆人欽敬平生安穩有始有終喜怒不形若得天權福貴刃星相助必主寬洪大量福壽綿綿犯重者有壽無福犯孤破厄星乃中命也十二星總論詳夫觀命之法當以命宮限數為先男怕孤驛凶星有天福天貴者不妨女怕破刃厄星有天權星者助夫旺子有天文天藝星者性巧有天福天貴天壽星者命穩實有天奸星而犯重者定主貧賤淫污玷辱宗祖行運而逢兩重者命限大晦月分而逢孤破厄星者此月亦主凶災男命而重天貴者貴而不貴兩重天權者權而無權天文重者男女泛濫女命天貴重者終許見貴若見四重貴者尅子而衣祿豐盈天福重者衣祿自然厄在時日重者反不為厄逢三厄者不唯無厄而衣祿有餘命限天權星者虗貴而刑妻尅子四厄星者主二子衣祿有餘命有二權星者壯重正大命有三權星者必主威權有二天破星者衣祿反穩有三破星者破敗下命有四破星者無衣祿而壽不長奸星見重者反不奸而正大有三奸星者狡獪下流之人有四奸星者亦主徙流刑敗文星重者主富貴文星三者衣祿少而多文學四文星者尅妻而損目二福者尅妻而見貴三福星者有壽而無福四福星者衣祿充二驛星者反生安間三驛星者主下賤四驛星者得奴僕力二孤星者有子孫三孤星者女尅夫男尅子四孤星者妻貧窮二刃星者多慈善三刃星者乃貴人有權之命四刃星者權貴而壽夭二藝星者刑妻而尅子三藝星者曚瞳而昏愚四藝星者踴蹬而無成二壽星者性愚魯三壽星者出家而高壽四壽星者離祖而窮苦貴驛二重多勞碌破若逢文必夭亡權若見孤多刑尅二孤尅壽者年雖高而破敗招非少年重奸者慳貪而福亦不永藝若逢奸刑傷破敗刃若見厄疾病貧窮生時逢二厄早歲凶亡四柱有三孤中年破敗刃厄同宮損自己而傷手足貴壽權生年月必豐祖業而顯門閭破刃孤厄會於一時難為夫妻子息十二星之理於斯備矣論一生之命孰有疑焉智者詳審而細推之自可究禍福於前知也論十二月生正月生人利官近貴大事成小仔細小心之命能招四方財源妻兒和合竝無尅破正月生人詩端然相貌是前緣平生快樂福綿綿貴人接引增吉慶和合團圓過百年二月生人心性溫和心無毒害聰明多智六親少緣中限發財大富貴半真半假之命二月生人詩平生性善自家知一生衣祿自豐肥錢穀家寶多富貴高人歡喜小人欺三月生人心性寬弘凡事忍耐初限平平中限發福末限榮華富貴之命三月生人詩為人心直自寬懷平生招得四方財中限榮華時發福猶如枯木遇春來四月生人心性不定名動四方愛結朋友不住祖業自立家風初限中限平平末限大發富貴四月生人詩一年命限勝一年不須瞋恨苦憂煎更得持齊方便福夫妻和合永團圓五月生人溫和良善心性伶俐有權勢威風行事正直貴人接引夫妻中途離別之命五月生人詩出入常常遇橫財貴人接引笑顏開田園事業多興旺富貴榮華次第來六月生人性巧伶俐為人遠達身有藝術不守祖業初有財中限吉利末限富貴機謀太重乃好命也六月生人詩平生衣祿自然昌為人顯達好文章優游快樂家豪富夫妻諧老百年長七月生人為人慈善作事仔細愛好初限平平中限少好末限富貴榮華之命也七月生人詩一世為人不必憂安然無事掛心頭家業田園宜自立方知福祿命中求八月生人眼目光暉聰明達理正真無私有藝有財文章近貴之命也若離祖生大貴八月生人詩為人端正貌堂堂心地聰明性善良作事多能心達理他年運到福綿長九月生人性剛招人是非有威權近貴之命姻緣相尅子晚妻遲之命也九月生人詩買賣生人事事強營謀動作志軒昂若能修善多作福管取衣資積滿箱十月生人大海之心不動不懶先難後易衣祿充身之命也先女後男出家亦難為師長徒弟在家亦難為子息夫妻命中多招刑尅十月生人詩十月生人慶吉星災殃永退不相侵持齊善念行方便衣祿盈餘自稱心十一月生人有權性急伶俐近貴心多計謀身有陪疾初限平平中限發福末限富貴之命也十一月生人詩早年獨立自成家衣祿從心自可誇骨肉弟兄無倚靠相交朋友水中華十二月生人百年勞心心直口快亦主暗疾父母兄弟難靠衣祿自能得四方之財半吉之命也十二月生人詩初限勤勞受苦心自成自立不求人心慈口快難藏毒長幼團圓過幾春論每月三十日內輪該吉凶星在命初一初七十三十九二十五此日生人太陽星值日為人衣祿有餘初限平常末限大好十九二十五歲男享榮華有父母得力女人乃旺夫發福之命初二初八十四二十二十六此日生人太陰星值日為人秀氣父母有尅六親無倚兄弟難靠男主清奇女主聰明成立之命也初三初九十五二十一二十七此日生人天武星值日主夫妻和合不能偕老子息刑傷末限榮華富貴之命招過房子離祖成家祖業田園耗散女人傷夫子息難招縱有也要別離過房者不妨初四初十十六二十二二十八此日生人天母星值日為人多學少成中限無財惹是招非姻緣和順末限富貴大吉利之命也初五十一十七二十三二十九此日生人天皇星值日為人伶俐衣祿有餘六親無分兄弟難倚財利無虧中平之命也初六十二十八二十四三十日此日生人太乙星值日為人多學多能清間高貴文墨之命初限大貴中限平穩末限大旺財祿之命兄弟無依方可論十二時生人吉凶子時生人性急命帶剛強作事反覆不定招人是非父母妻子有尅自手成家之命也十一十八三十六四十六五十八八十九歲之壽丑時生人父母刑尅一生敬貴有勢有力末限大好福祿有餘之命也十八二十六三十一四十六有災其年可持齊作福七十三歲之壽寅時生人父母兄弟妻子多尅離祖方好初限平平末限發財二十六二十九三十三三十九四十九六十六歲主得氣血之疾過此九十六歲之壽卯時生人父母兄弟妻子無力初限中限作事無成末限安穩一生難守祖業出家入贅先凶後吉十八二十六歲上有災過此可延九十歲壽辰時生人父母兄弟妻子難全性格聰明伶俐初限有財中限破財末限依舊光暉十九二十七三十六三十九小災過此七十五歲之壽巳時生人聰明俊麗初限榮華衣祿有餘自家成立産業骨肉刑尅之命三十一三十六四十九有災過此七十四歲之壽午時生人為人春風和氣改換祖業初限中限吉利宜持齊作福十三三十二三十六四十九有疾過此七十八歲之壽未時生人父母不全夫妻刑尅勞碌成家之命初限有財中限驚恐末限財祿有餘十九二十九五十六有災過此七十三歲之壽申時生人離祖則吉父母兄弟不全夫妻到老向善近貴之命初限反覆末限大好十九二十二二十六三十八四十九有災過此七十七歲之壽酉時生人為人淳厚難為父母兄弟初限反覆末限大好二十二二十八三十九四十六小災過此七十七歲之壽戌時生人清俊秀美一生快樂之命但福祿亦主進退初中二限平安吉利末限父母相刑妻子有損十四二十六二十九三十六有災過此七十五歲之壽亥時生人心直口快自然福祿加增一生辛勤勞碌初限祖業難守末限大吉之命也二十六三十六四十九五十六小災過此八十八歲之壽論十二時初中末生人吉凶子初生人先尅母自成家計作事七進八退十成九敗六親疏淡衣祿浮沈末限享福好收成結果之命詩子初果如何作事進退多師術僧道吉一世受奔波又生子先兒郎子息不過雙娶妻換頭婦末後發田莊子中生人無尅破一生作事估強有起有倒有成有敗末後雖大興旺須用離祖入贅為吉詩天祿雖興旺時值活離宮前程防小失作福保亨通子末生人先主尅父六親不得力子息不順一生勤苦勞碌作事有頭無尾財帛不聚更改之命晚景好詩子末將過丑子孫三個有好子須一個老景三春柳丑初生人無尅破主進田莊衣祿俱全富貴安間子孫榮顯末限大好之命詩晚景收成好二子換頭妻兄弟相形尅榮華福祿齊丑中生人為人老實進益田莊自小夫妻得力父母六親相和末限大發富貴之命詩丑正先防父頭男防老傷須要防妻損爺娘亦恐傷聰明伶俐有福祿益衣糧財帛田園廣榮華末運昌丑末生人心地好善先凶後吉前主尅母孤獨自成男女皆離祖之命也詩丑末先尅母女命三妨父先男後有女晚景貴人助寅初生人主先尅父依祿有餘為人聰明發達自成自立有盈有虧心性不定好勝好間末限有福之命詩寅初進田莊兒女喜成雙財祿中年旺晚景自安康寅中生人若無冲尅父母雙全衣祿盈餘有福有壽自成家業先主榮華末景安常之命詩寅中命吉昌聰明性氣剛一生宜出祖名姓四方揚寅正少兄弟三孫世代長尅妻須保守財旺益田莊寅末生人先尅母自家成立六親無倚離祖出家之命一生勤苦勞心妻子有尅帶疾方可延壽詩寅末命平安祖業末能看一生多險厄舟破上高灘子媳招宜晚頭妻未有緣弟兄無倚靠假子送歸天卯初生人先主尅母四方衣祿有助祖業既成又敗作事有頭無尾家計自成立之命詩生來初卯時為人最孤恓衣祿隨時度見喜又生悲草土自成立堪憐尅正妻兄弟不得力子息定招遲卯中生人命無尅破一生主得橫財不求自至武藝立身之命詩富貴架高梁衣祿甚風光一生家業旺武藝近君王子息成行列妻富定見雙宮星身命主兄弟列成斑卯末生人先尅父十九作事成敗衣祿進退末限平平親子難招祖業雖多不得承受獨權自立在外成家之命也詩初限甚勞碌憂勤自立家知音時運至枯木又生花命裡多兄弟田莊又屬他子息雖難靠賢妻甚可誇辰初生人先尅父若是長子必然難為兄弟聰明曉事慈心愛人大事成小衣祿平常自成自立之命子息晚招離祖出贅方可詩衣祿四方來兄弟六親乖平地生荊𣗥間非擾悶懷雙親椿早折妻子淚盈腮一生多反覆疑是命中該辰中生人先主尅母衣祿平平立心公道剛直中限富貴性急如風吹火易發易解自成家業妻王高門贅媚外居之命詩日日走奔波財源自有無六親不得力口舌事常多辰正妻官厄兒孫未見知外子承親母晚景甚巍峩辰末生人命無尅破心性公平財祿穩足多受快樂如魚化龍門飛騰變化顯達家門之命詩魚龍變化身衣祿自然盈一朝雷雨作四海振聲名辰末頭妻尅闐房親上親親兒雖得力外子更相親巳初生人先主尅母初年富貴田宅進退權柄自立之命詩此命出尋常修行燒好香子母多離別家業始榮昌巳初子孫早鴻鴈不成行田園進復退財帛日中霜巳中生人先生尅父平生惟直開口談天說地為人多管閒事多成多敗六親無力志氣超羣之命詩立身身自穩舉意意冲天膽氣如天大末限福綿綿巳中子孫望亦主進田園尅妻二子立後代子孫賢巳末生人無尅破衣祿豐足兄弟俱全性巧近貴為人成家快樂之命若出家大吉詩巳末喜文章成家大吉昌蟾宮相咫尺立在貴人鄉巳末福無量妻宮恐見傷立身多快樂晚景受安康午初生人無尅破一生富貴文武皆通為人慷慨出衆超羣但六親無力出外成家之命詩生來正午初一動百人扶安車并坐馬變化貴人摸六親不得力兄弟亦多疏妻房多財富富室擁千奴午中生人先尅父衣祿辛苦成敗反覆先難後吉末限發達之命詩生來不自由衣食周未周巴巴啾唧過何處逞風流午末生人先尅母六親無力祖業難居衣祿辛苦勤儉生涯末限成家之命詩午末命平常財子隨分過若要求進益一生見奔波未初生人無尅破兄弟完全到處風流先勤後怠衣食足用不求自至初限辛苦晚景添財詩未初無破敗二子命中招兄弟相完聚田宅後滔滔未中生人先尅父衣祿自然心中平等人事周全功名富貴六親難為前凶後吉之命詩未中先尅父又主損頭妻兄弟須相忍外子後相依未末生人先尅母招四方之財不得他人之力喜怒不常入贅出家之命詩衣祿隨時至人情好又休祖業多破敗敗了喜反憂申初生人無尅破性巧聰明逢凶有救大事成小一生穩厚損妻子自成家業之命詩命裡根基旺家庭福有餘早發文武籍錦繡換麻衣申中生人先尅父六親無力招是惹非小人不足衣祿有餘之命詩人情好便休莫信小人流安心守本分慈善度春秋申末生人先尅母六親不得力婚配宜遲妻招一姓為人多疑逢凶化吉之命詩奔花拋祖業獨立自孤持外生隨母老末限定盈餘酉初生人無尅破衣祿充足多招祖業性巧聰明男如龍虎文武皆通女精巧晚景稱意詩金運自光暉事業錦衣歸運籌多智慧財祿豈有虧酉中生人先尅父六親不和宜與二姓同居身間心自性操持發福之命詩衣祿頗隨時猶如報曉雞能啼催早起自己未能飛酉末生人先尅母六親不得力性急不悔衣祿無虧辛榮反覆子息難為終年孤獨之命詩酉末子遲來清高出家材妻宮防有尅宜把福田栽戌初生人先尅父兄弟不得力良善近貴之命晚景發福孝弟忠信詩良善行公道財産天送來自成自立命常近貴人臺戌中生人先尅母六親無靠食衣在於公門逢凶化吉心貪快樂辛苦勞心膽如麻子口似風顛末限發福之命詩處衆得謙和皇恩受祿多威德人欽敬主張誰敢過亥初生人先尅父作事百般如意一生近貴能為福壽全有之命詩萬般風流事功名自有成種種皆遂意福壽滿山青亥中生人無尅破父母前聲應後聲平等有權不犯災厄親近貴人晚景發達之命詩亥中無尅破衣祿多饒益有權兼有勢性氣不能測亥末生人先尅母衣祿隨時六親得力貴人扶助宜作福修齊末後得貴子顯達之命詩十二時中亥末遲衣祿無多但隨時肯向善心修齊戒定生貴子來相持上半年夜半前作前半月下半年夜半後作後半月不問男女地支四字子寅午申戌為陽丑亥酉未巳卯為陰四字中陽多陰少主尅父陰多陽少主尅母得之於心應之於手年上起月月上起日日上起時時上起刻男順女逆逢凶則凶逢貴則貴運掌之間照然莫能逃焉推人五命得病忌日金命之人墓在丑乙丑日得病大凶木命之人墓在未癸未日得病大凶水命之人墓在辰壬辰日得病大凶火命之人墓在戌甲戌日得病大凶土命之人墓在辰丙辰日得病大凶此法玄機通天地大月從上數至下小月從下數至上先問得病月期數便知病人患吉凶妙訣推算無人會先天毫𨤲定生死初一日起子細論馬立人生災有救馬倒收拾入幽冥馬斜有災即可治祿正命重命不傷祿馬俱倒鬼到門祿斜有災請醫冥正五九二六十三七十一四八十二論十二時歌子午卯酉四字高為人聰明逞英豪多有兄弟難倚靠一雙父母不相交時初時末無伴侶時正孤單獨自挑財重祿榮身貴顯翼冲雲漢福滔滔寅申巳亥四字強為人聰慧近文章時正兄弟三四個時初時末也成雙父母無刑多倚靠榮華富貴坐高堂若得父母雙全在晚景榮華大吉昌辰戌丑未四字孤上妨父母六親疏雖有兄弟難倚靠祖房常被別人祖時初管取先亡父時末尅母在冥途公門事業為生計男為僧道女為尼寅巳申亥左丑辰未戌右子午卯酉正
